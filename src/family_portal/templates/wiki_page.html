{% extends "base.html" %}
{% block title %}{{ page.title }}{% endblock %}
{% block content %}
<div class="page-header">
  <h1>{{ page.title }}</h1>
  <div>
    <a class="button-link" href="/wiki/{{ page.slug }}/edit">Edit</a>
    <a class="button-link" href="/wiki/{{ page.slug }}/history">History</a>
  </div>
</div>
<p class="muted">Last updated {{ (page.updated_at | localtime).strftime('%d %b %Y, %H:%M') }} by {{ page.updated_by.display_name }}</p>
<article class="prose">
  {{ content_html | safe }}
</article>
{% endblock %}
