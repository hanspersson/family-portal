[project]
name = "family-portal"
version = "0.1.0"
description = "A self-hosted family portal: shared calendar, wiki, and file storage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "sqlalchemy>=2.0",
    "bcrypt>=4.0",
    "python-dateutil>=2.9",
    "markdown>=3.7",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]
prod = [
    "gunicorn>=23.0",
]

[project.scripts]
family-portal = "family_portal.wsgi:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/family_portal"]

[tool.ruff]
line-length = 100
target-version = "py311"
